<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover"><meta name="theme-color" content="#305c42">
<title>小熊偷蜂蜜 · 森林冒险</title>
<style>
:root{color-scheme:light;--cream:#fff2d2;--brown:#58351f;--gold:#efac3e}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{height:100%;margin:0;overflow:hidden}body{font-family:ui-rounded,'PingFang SC','Hiragino Sans GB',system-ui,sans-serif;background:radial-gradient(circle at 50% 20%,#c8eac7,#376746);display:flex;align-items:center;justify-content:center;color:var(--brown);touch-action:none}.shell{width:min(100vw,490px);height:min(100dvh,900px);min-height:400px;position:relative;overflow:hidden;background:#a7d8ad;box-shadow:0 16px 65px #1c382a66}.shell canvas{width:100%;height:100%;display:block;touch-action:none}.hud{position:absolute;top:calc(env(safe-area-inset-top) + 12px);left:12px;right:12px;display:flex;align-items:center;justify-content:space-between;gap:6px;pointer-events:none}.pill{border:2px solid #a46c31;background:#fff2d9ed;border-radius:16px;padding:7px 10px;font-size:14px;font-weight:900;box-shadow:0 4px 0 #86562838;white-space:nowrap}.hud button{pointer-events:auto}.round{width:41px;height:41px;border-radius:13px;border:2px solid #a46c31;background:#fff2d9;box-shadow:0 4px 0 #86562838;font-size:20px;cursor:pointer}.info{position:absolute;top:calc(env(safe-area-inset-top) + 65px);left:50%;transform:translateX(-50%);width:max-content;max-width:93%;background:#213b2fc9;color:#fff9e6;border-radius:12px;padding:8px 14px;font-size:13px;font-weight:700;text-align:center;pointer-events:none;transition:opacity .35s}.pad{display:none!important;position:absolute;bottom:calc(env(safe-area-inset-bottom) + 24px);left:18px;width:146px;height:146px;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:5px;touch-action:none}.pad button,.action{border:2px solid #fceac4ab;background:#fff0c3cf;color:#67411e;box-shadow:0 5px 0 #63431c59;backdrop-filter:blur(3px);font-size:23px;font-weight:900;touch-action:none;cursor:pointer;user-select:none}.pad button{border-radius:16px}.pad button:active,.action:active{transform:translateY(3px);box-shadow:0 2px 0 #63431c59}.pad .up{grid-column:2;grid-row:1}.pad .left{grid-column:1;grid-row:2}.pad .right{grid-column:3;grid-row:2}.pad .down{grid-column:2;grid-row:3}.action{position:absolute;right:18px;bottom:calc(env(safe-area-inset-bottom) + 57px);height:80px;width:102px;border-radius:50%;font-size:17px;line-height:1.3}.action b{font-size:25px}.overlay{position:absolute;inset:0;background:#152e29ab;display:flex;justify-content:center;align-items:center;padding:22px;backdrop-filter:blur(5px)}.overlay.hidden{display:none}.panel{width:100%;max-width:350px;border:5px solid #9e6237;border-radius:28px;background:linear-gradient(155deg,#fff9e9,#f9dfaa);box-shadow:0 13px 0 #4e2e2066,0 23px 45px #0003;padding:23px 19px 25px;text-align:center}.panel .mascot{font-size:55px}.panel h1{font-size:29px;line-height:1.25;margin:6px 0;color:#694126}.panel p{font-size:14px;line-height:1.8;margin:12px 0}.panel .tip{background:#eed09d;border-radius:12px;padding:10px;font-weight:700;font-size:13px}.primary{margin-top:16px;padding:13px 30px;min-width:185px;border:2px solid #97511c;border-radius:18px;background:linear-gradient(#ffd86b,#ef9e32);box-shadow:0 5px 0 #a35e25;color:#60350f;font-weight:900;font-size:18px;cursor:pointer}.primary:active{transform:translateY(3px)}.secondary{display:block;margin:14px auto 0;padding:8px;background:transparent;border:0;text-decoration:underline;color:#825329;cursor:pointer}@media(min-width:520px){.shell{border:8px solid #efe1b5;border-radius:25px}}@media(max-height:650px){.pad{transform:scale(.8);transform-origin:left bottom}.action{transform:scale(.82);transform-origin:right bottom}.pill{padding:5px 7px;font-size:12px}.panel{padding:15px}.panel h1{font-size:24px}}
</style>
</head>
<body>
<main class="shell" id="shell" aria-label="小熊偷蜂蜜游戏">
<canvas id="world" aria-label="森林冒险游戏画面"></canvas>
<div class="hud"><div class="pill" id="score">🍯 0 / 5</div><div class="pill" id="health">❤️❤️❤️</div><div class="pill" id="time">⏱ 90秒</div><button class="round" id="pause" aria-label="暂停游戏">⏸</button></div>
<div class="info" id="info">靠近蜂巢，点击「偷蜜」！</div>
<div class="pad" id="pad"><button class="up" data-dir="up" aria-label="向上">▲</button><button class="left" data-dir="left" aria-label="向左">◀</button><button class="right" data-dir="right" aria-label="向右">▶</button><button class="down" data-dir="down" aria-label="向下">▼</button></div>
<button class="action" id="steal" aria-label="偷蜂蜜"><b>🍯</b><br>偷蜜</button>
<div class="overlay" id="overlay"><div class="panel"><div class="mascot" id="mascot">🐻🍯</div><h1 id="heading">小熊偷蜂蜜</h1><p id="description">偷偷溜进森林，靠近蜂巢采集蜂蜜。小心巡逻的蜜蜂！<br>在90秒内收集5罐蜂蜜，就能赢得胜利。</p><div class="tip" id="tip">📱 点击森林让小熊走过去，拖动手指改变方向，点击「偷蜜」<br>⌨️ Mac用 WASD / 方向键移动，空格偷蜜</div><button class="primary" id="start">开始冒险 ▶</button><button class="secondary" id="sound">🔊 音效：开启（点击切换）</button></div></div>
</main>
<script>
(()=>{'use strict';
const c=document.getElementById('world'),g=c.getContext('2d'),shell=document.getElementById('shell');
const el=id=>document.getElementById(id),V={w:420,h:740};let scale=1,offsetX=0,offsetY=0;
function resize(){const r=shell.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);c.width=Math.round(r.width*dpr);c.height=Math.round(r.height*dpr);c.style.width=r.width+'px';c.style.height=r.height+'px';scale=Math.min(c.width/V.w,c.height/V.h);offsetX=(c.width-V.w*scale)/2;offsetY=(c.height-V.h*scale)/2}window.addEventListener('resize',resize);resize();
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v)),dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y),rnd=(n)=>{let x=Math.sin(n*127.1+33)*43758.5453;return x-Math.floor(x)};
let target=null,dragPointer=null;let mode='menu',score=0,hp=3,remaining=90,player={x:210,y:626,r:19,face:1,walk:0,inv:0},bees=[],hives=[],particles=[],keys=new Set(),held=new Set(),message='靠近蜂巢，点击「偷蜜」！',msgTimer=0,last=0,elapsed=0,beep=true,audio=null;
function sound(freq=440,duration=.08,type='sine'){if(!beep)return;try{audio=audio||new(window.AudioContext||window.webkitAudioContext)();if(audio.state==='suspended')audio.resume();let o=audio.createOscillator(),gain=audio.createGain();o.type=type;o.frequency.setValueAtTime(freq,audio.currentTime);o.frequency.exponentialRampToValueAtTime(freq*.8,audio.currentTime+duration);gain.gain.setValueAtTime(.075,audio.currentTime);gain.gain.exponentialRampToValueAtTime(.001,audio.currentTime+duration);o.connect(gain).connect(audio.destination);o.start();o.stop(audio.currentTime+duration)}catch(e){}}
const trees=Array.from({length:22},(_,i)=>({x:20+rnd(i+2)*388,y:125+rnd(i+24)*530,r:23+rnd(i+17)*16})).filter(t=>!([225,354,480].some(y=>Math.hypot(t.x-210,t.y-y)<76)||Math.hypot(t.x-210,t.y-625)<90));
const flowers=Array.from({length:105},(_,i)=>({x:12+rnd(i+102)*396,y:114+rnd(i+242)*585,kind:i%4,size:2+rnd(i+9)*3}));
function setup(){score=0;hp=3;remaining=90;elapsed=0;player={x:210,y:624,r:19,face:1,walk:0,inv:0};hives=[{x:75,y:215,full:true},{x:340,y:302,full:true},{x:90,y:456,full:true},{x:328,y:526,full:true},{x:214,y:164,full:true}];bees=[{x:240,y:220,homeX:240,homeY:220,phase:0,ang:0,speed:72},{x:190,y:410,homeX:190,homeY:410,phase:2,ang:0,speed:82},{x:315,y:570,homeX:315,homeY:570,phase:4,ang:0,speed:87}];particles=[];keys.clear();held.clear();target=null;dragPointer=null;message='靠近蜂巢，点击「偷蜜」！';msgTimer=3;mode='playing';el('overlay').classList.add('hidden');updateHUD();}
function updateHUD(){el('score').textContent='🍯 '+score+' / 5';el('health').textContent='❤️'.repeat(hp)+'♡'.repeat(3-hp);el('time').textContent='⏱ '+Math.ceil(remaining)+'秒';el('pause').textContent=mode==='paused'?'▶':'⏸';}
function show(text,duration=1.6){message=text;msgTimer=duration;el('info').textContent=text;el('info').style.opacity='1'}
function end(won){mode=won?'won':'lost';keys.clear();held.clear();target=null;el('overlay').classList.remove('hidden');el('mascot').textContent=won?'🐻🏆':'🐻💧';el('heading').textContent=won?'偷蜜成功！':'冒险结束';el('description').innerHTML=won?'成功带回 <b>'+score+' 罐蜂蜜</b>！<br>用时 '+Math.round(90-remaining)+' 秒，森林小熊真厉害！':'这次收集了 <b>'+score+' 罐蜂蜜</b>。<br>'+(hp<=0?'被蜜蜂发现太多次了。':'时间用完了。')+' 再试一次吧！';el('tip').textContent='🍯 集齐5罐就能获胜，注意避开巡逻蜜蜂';el('start').textContent='再玩一次 ↻';sound(won?740:195,.27,won?'sine':'triangle');}
function togglePause(){if(mode==='playing'){mode='paused';target=null;el('overlay').classList.remove('hidden');el('mascot').textContent='⏸️🌳';el('heading').textContent='冒险暂停';el('description').textContent='小熊在森林里休息一下。';el('tip').textContent='当前收集 '+score+' / 5 罐蜂蜜';el('start').textContent='继续冒险 ▶'}else if(mode==='paused'){mode='playing';el('overlay').classList.add('hidden')}updateHUD()}
function steal(){if(mode!=='playing')return;const h=hives.find(h=>h.full&&dist(h,player)<61);if(!h){show('再靠近蜂巢一点点！');sound(210,.06);return}h.full=false;score++;show('太棒了！蜂蜜 +1 🍯',1.5);sound(600,.08);setTimeout(()=>sound(890,.11),100);for(let i=0;i<15;i++){let a=i*Math.PI*2/15;particles.push({x:h.x,y:h.y,vx:Math.cos(a)*(25+i*3),vy:Math.sin(a)*(25+i*3)-25,life:.8})}updateHUD();if(score>=5)end(true)}
const rounded=(x,y,w,h,r)=>{g.beginPath();g.roundRect(x,y,w,h,r)};
function ellipse(x,y,rx,ry,fill){g.beginPath();g.ellipse(x,y,rx,ry,0,0,Math.PI*2);g.fillStyle=fill;g.fill()}
function colorCurve(){const grad=g.createLinearGradient(0,0,0,740);grad.addColorStop(0,'#c6edc6');grad.addColorStop(.6,'#a8d893');grad.addColorStop(1,'#76bc7b');g.fillStyle=grad;g.fillRect(0,0,420,740);g.fillStyle='#d5e9a0';g.beginPath();g.moveTo(145,93);g.bezierCurveTo(130,185,220,210,171,322);g.bezierCurveTo(111,459,289,526,220,740);g.lineTo(328,740);g.bezierCurveTo(361,540,196,444,262,331);g.bezierCurveTo(319,214,220,193,253,93);g.fill();g.strokeStyle='#edf6bb';g.lineWidth=7;g.globalAlpha=.45;g.stroke();g.globalAlpha=1}
function tree(x,y,r){ellipse(x+3,y+11,r*.55,11,'#38683b3b');g.fillStyle='#8b5c37';rounded(x-9,y-11,18,37,5);g.fill();ellipse(x-13,y-23,r*.76,r*.79,'#397e52');ellipse(x+15,y-25,r*.76,r*.87,'#46965c');ellipse(x,y-42,r*.84,r*.88,'#59a963');ellipse(x-14,y-49,r*.30,r*.2,'#a5d78099')}
function hive(h,t){ellipse(h.x,h.y+27,29,10,'#2e623d52');g.fillStyle='#936136';rounded(h.x-4,h.y-12,8,38,3);g.fill();if(!h.full){ellipse(h.x,h.y-10,15,13,'#997647');ellipse(h.x-3,h.y-13,8,6,'#644b35');return}ellipse(h.x,h.y-21,25,30,'#f6ba42');for(let i=-2;i<=2;i++){g.beginPath();g.ellipse(h.x,h.y-22+i*9,23-Math.abs(i)*3,6,0,0,Math.PI);g.strokeStyle='#ce8129';g.lineWidth=3;g.stroke()}ellipse(h.x+4,h.y-11,7,9,'#784218');ellipse(h.x-12,h.y-34,6,3,'#ffdc82');if(dist(h,player)<61&&mode==='playing'){g.strokeStyle='#fff2af';g.lineWidth=3;g.setLineDash([6,6]);g.beginPath();g.arc(h.x,h.y-17,36+Math.sin(t*4)*2,0,7);g.stroke();g.setLineDash([])}}
function drawBee(b,t){g.save();g.translate(b.x,b.y+Math.sin(t*9+b.phase)*3);ellipse(0,11,18,5,'#3e653f50');ellipse(-9,-12,11,8,'#ffffffbf');ellipse(8,-14,11,8,'#ffffffbf');ellipse(0,0,19,13,'#ffd55c');g.save();g.beginPath();g.ellipse(0,0,19,13,0,0,7);g.clip();g.fillStyle='#6d4a2e';g.fillRect(-7,-15,6,30);g.fillRect(7,-15,5,30);g.restore();ellipse(9,-3,2.5,3,'#332d25');g.strokeStyle='#6b4b36';g.lineWidth=2;g.beginPath();g.moveTo(-15,-2);g.lineTo(-22,1);g.stroke();g.restore()}
function drawBear(t){g.save();let bob=mode==='playing'&&player.walk>.1?Math.sin(t*13)*2:0;g.translate(player.x,player.y+bob);if(player.inv>0&&Math.floor(t*12)%2){g.globalAlpha=.45}ellipse(0,12,22,7,'#305c414d');g.scale(player.face,1);ellipse(-15,-27,10,11,'#a76539');ellipse(15,-27,10,11,'#a76539');ellipse(-15,-27,5,6,'#df9e6a');ellipse(15,-27,5,6,'#df9e6a');ellipse(0,-5,21,24,'#995b32');ellipse(0,-9,14,16,'#c58b51');ellipse(-12,12,9,6,'#704528');ellipse(12,12,9,6,'#704528');ellipse(0,-22,23,21,'#ac6b40');ellipse(0,-15,12,10,'#e7b481');ellipse(-8,-28,3,3,'#31251b');ellipse(9,-28,3,3,'#31251b');ellipse(1,-18,4,3,'#4c2c24');g.strokeStyle='#643d2b';g.lineWidth=1.5;g.beginPath();g.arc(1,-15,4,0,Math.PI);g.stroke();g.fillStyle='#dc714d';rounded(-13,-2,27,5,3);g.fill();g.restore()}
function drawScene(t){g.save();g.setTransform(1,0,0,1,0,0);g.fillStyle='#244f38';g.fillRect(0,0,c.width,c.height);g.translate(offsetX,offsetY);g.scale(scale,scale);colorCurve();for(const f of flowers){ellipse(f.x,f.y,f.size,f.size,f.kind===0?'#f8e8ad':f.kind===1?'#fff0e0':f.kind===2?'#f0a9ba':'#d4aee8');ellipse(f.x,f.y,1.6,1.6,'#e9a33d')}for(let i=0;i<9;i++){let x=18+(i*51)%414;ellipse(x,100,30,22,'#438f5b')}g.font='bold 19px system-ui';g.textAlign='center';g.fillStyle='#426b4c';g.fillText('蜜 蜂 森 林',210,78);for(const tree of trees.filter(q=>q.y<player.y-10))treeFn(tree);for(const h of hives)hive(h,t);for(const b of bees)drawBee(b,t);if(target&&mode==='playing'){g.save();g.strokeStyle='#fffbea';g.lineWidth=2.5;g.globalAlpha=.85;g.beginPath();g.arc(target.x,target.y,10+Math.sin(t*7)*2,0,Math.PI*2);g.stroke();g.beginPath();g.arc(target.x,target.y,3,0,Math.PI*2);g.fillStyle='#ffcf55';g.fill();g.restore()}drawBear(t);for(const tree of trees.filter(q=>q.y>=player.y-10))treeFn(tree);for(let i=particles.length-1;i>=0;i--){let p=particles[i];g.globalAlpha=Math.max(0,p.life/.8);ellipse(p.x,p.y,3,3,'#fff4ae');g.globalAlpha=1}g.restore();function treeFn(tr){tree(tr.x,tr.y,tr.r)}}
function step(dt,t){if(mode!=='playing')return;elapsed+=dt;remaining-=dt;player.inv=Math.max(0,player.inv-dt);let dx=(keys.has('right')||held.has('right')?1:0)-(keys.has('left')||held.has('left')?1:0),dy=(keys.has('down')||held.has('down')?1:0)-(keys.has('up')||held.has('up')?1:0);let len=Math.hypot(dx,dy);if(len){target=null;dx/=len;dy/=len;}else if(target){let distance=Math.hypot(target.x-player.x,target.y-player.y);if(distance<=3){target=null;dx=dy=0;}else{dx=(target.x-player.x)/distance;dy=(target.y-player.y)/distance;len=Math.min(distance,158*dt)/(158*dt||1);}}if(len){let move=Math.min(158*dt,target?Math.hypot(target.x-player.x,target.y-player.y):158*dt);player.x=clamp(player.x+dx*move,26,394);player.y=clamp(player.y+dy*move,132,681);player.face=dx<0?-1:dx>0?1:player.face;player.walk+=dt}else player.walk=0;
for(const b of bees){const d=dist(b,player),chase=d<113;b.phase+=dt;b.ang+=dt*.8;if(chase){b.x+=(player.x-b.x)/Math.max(d,1)*b.speed*1.25*dt;b.y+=(player.y-b.y)/Math.max(d,1)*b.speed*1.25*dt}else{const tx=b.homeX+Math.cos(b.ang+b.phase*.4)*51,ty=b.homeY+Math.sin(b.ang+b.phase*.4)*39;b.x+=(tx-b.x)*Math.min(dt*1.6,1);b.y+=(ty-b.y)*Math.min(dt*1.6,1)}b.x=clamp(b.x,22,398);b.y=clamp(b.y,128,675);if(dist(b,player)<31&&player.inv<=0){hp--;player.inv=2.1;show('哎呀！被蜜蜂蜇到了！🐝',1.5);sound(180,.22,'sawtooth');player.y=clamp(player.y+55,135,675);updateHUD();if(hp<=0){end(false);return}}}
for(let i=particles.length-1;i>=0;i--){const p=particles[i];p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=90*dt;p.life-=dt;if(p.life<=0)particles.splice(i,1)}if(msgTimer>0){msgTimer-=dt;if(msgTimer<=0)el('info').style.opacity='.0'}else if(hives.some(h=>h.full&&dist(h,player)<61)){el('info').textContent='蜂巢就在附近！点击「偷蜜」🍯';el('info').style.opacity='1'}if(remaining<=0)end(false);updateHUD()}
function loop(timestamp){const t=timestamp/1000,dt=last?Math.min((timestamp-last)/1000,.05):0;last=timestamp;step(dt,t);drawScene(t);requestAnimationFrame(loop)}requestAnimationFrame(loop);
el('start').addEventListener('click',()=>{if(mode==='paused')togglePause();else setup()});el('pause').addEventListener('click',togglePause);el('steal').addEventListener('click',steal);el('sound').addEventListener('click',()=>{beep=!beep;el('sound').textContent=beep?'🔊 音效：开启（点击切换）':'🔇 音效：关闭（点击切换）';if(beep)sound()});
const mapping={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',KeyW:'up',KeyS:'down',KeyA:'left',KeyD:'right'};window.addEventListener('keydown',e=>{const d=mapping[e.code];if(d){e.preventDefault();keys.add(d)}else if(e.code==='Space'){e.preventDefault();if(!e.repeat)steal()}else if(e.code==='Escape'||e.code==='KeyP'){e.preventDefault();if(!e.repeat)togglePause()}});window.addEventListener('keyup',e=>{if(mapping[e.code])keys.delete(mapping[e.code])});window.addEventListener('blur',()=>{keys.clear();held.clear();if(mode==='playing')togglePause()});
function setTapTarget(e){if(mode!=='playing')return;const r=c.getBoundingClientRect();const sx=(e.clientX-r.left)*c.width/r.width,sy=(e.clientY-r.top)*c.height/r.height;const px=(sx-offsetX)/scale,py=(sy-offsetY)/scale;if(px<0||px>V.w||py<0||py>V.h)return;target={x:clamp(px,26,394),y:clamp(py,132,681)};}c.addEventListener('pointerdown',e=>{if(mode!=='playing')return;e.preventDefault();dragPointer=e.pointerId;c.setPointerCapture(e.pointerId);setTapTarget(e)});c.addEventListener('pointermove',e=>{if(e.pointerId===dragPointer&&mode==='playing'){e.preventDefault();setTapTarget(e)}});for(const eventName of ['pointerup','pointercancel','lostpointercapture'])c.addEventListener(eventName,e=>{if(e.pointerId===dragPointer)dragPointer=null});
for(const b of el('pad').querySelectorAll('button')){const d=b.dataset.dir;b.addEventListener('pointerdown',e=>{e.preventDefault();held.add(d);b.setPointerCapture(e.pointerId)});const release=e=>{e.preventDefault();held.delete(d)};b.addEventListener('pointerup',release);b.addEventListener('pointercancel',release);b.addEventListener('lostpointercapture',()=>held.delete(d))}
})();
</script></body></html>
